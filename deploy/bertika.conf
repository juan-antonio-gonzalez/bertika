# Bertika - configuracion nginx (template de produccion).
# Se aplica sobre /etc/nginx/sites-available/bertika en el VPS.
# El bloque SSL (80 -> 443 y listen 443) lo administra Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name bertika.com www.bertika.com srv1981179.hstgr.cloud;

    root /var/www/bertika;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /tracker/ {
        try_files $uri /index.html;
    }

    # API (backend Express -> 127.0.0.1:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Fotos de diagnostico subidas por el backend
    location /uploads/ {
        alias /var/www/bertika/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}